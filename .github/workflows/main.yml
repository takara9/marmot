name: marmot CI on self-hosted hv2
on: 
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'TAG'
env:
  # Setting an environment variable with the value of a configuration variable
  env_var: ${{ vars.ENV_CONTEXT_VAR || 'MARMOT CI' }}
  DEBUG: true

jobs:
  # Label of the job
  lint-check-start:
    runs-on: [ self-hosted, any ]
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - uses: golangci/golangci-lint-action@v9
      with:
        args: --new-from-rev=origin/main

  module-tests:
    runs-on: [ self-hosted, any ]
    needs: 
      - lint-check-start
    if: always() 
    steps:
    #- uses: actions/checkout@v5
    - name: 時間調整 緩やかに後発にする
      run: | 
        sleep 10

  system-tests:
    runs-on: [ self-hosted, any ]
    needs: 
      - lint-check-start
    if: always() 
    steps:
    - name: 時間調整 緩やかに先行させる
      run: | 
        sleep 1
    #- uses: actions/checkout@v5

  package-config:
    runs-on: [ self-hosted, any ]
    needs: 
      - module-tests
    if: always() 
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: コンフィグパッケージ
      run: | 
        cd pkg/config
        sudo -E env "PATH=$PATH" make test
        cd ../..

  package-etcd-access:
    runs-on: [ self-hosted, any ]
    needs: 
      - module-tests
    if: always() 
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: ETCDのデータアクセス パッケージ
      run: | 
        cd pkg/db
        sudo -E env "PATH=$PATH" make test
        cd ../..

  package-qcow2-manipulation:
    runs-on: [ self-hosted, any ]
    needs: 
      - module-tests
    if: always() 
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: QCOW2操作 パッケージ
      run: | 
        cd pkg/qcow
        sudo -E env "PATH=$PATH" make test
        cd ../..

  package-util:
    runs-on: [ self-hosted, any ]
    needs:
      - module-tests
    if: always()
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: ランナーのセットアップ
      run: |
        sudo -E env "PATH=$PATH" ./tools/setup.sh
    - name: ユーティリティ パッケージ テスト
      run: | 
        cd pkg/util
        sudo -E env "PATH=$PATH" make test
        cd ../..
    - name: ランナーのセットアップ
      run: |
        sudo -E env "PATH=$PATH" ./tools/cleanup.sh 

  mactl-command-tests:
    runs-on: [ self-hosted, any ]
    needs:
      - module-tests
    if: always()
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: mactl コマンド テスト
      run: |
        cd cmd/mactl
        sudo -E env "PATH=$PATH" make test-unit
        cd ../..

  package-lvm:
    runs-on: [ self-hosted, any ]
    needs: 
      - module-tests
    if: always() 
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: ロジカルボリューム マネージャー 操作パッケージ
      run: | 
        cd pkg/lvm
        sudo -E env "PATH=$PATH" make test
        cd ../..
      
  package-ceph:
    runs-on: [ self-hosted, any ]
    needs: 
      - module-tests
    env:
      CEPH_POOL_KEY: ${{ secrets.CEPH_POOL_KEY }}
    if: always() 
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: Cephブロックストレージ操作パッケージ
      run: | 
        cd pkg/ceph
        sudo -E env "PATH=$PATH" make test
        cd ../..

  package-virsh:
    runs-on: [ self-hosted, any ]
    needs: 
      - module-tests
    if: always() 
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: ランナーのセットアップ
      run: |
        sudo -E env "PATH=$PATH" ./tools/setup.sh
    - name: 仮想ネットワーク作成
      run: | 
        sudo -E env "PATH=$PATH" ./tools/setup-libvirt-networks.sh
    - name: 仮想化操作 パッケージ
      run: | 
        cd pkg/virt
        sudo -E env "PATH=$PATH" make test
        cd ../..
    - name: 仮想ネットワーク削除
      if: always()
      run: |
        sudo -E env "PATH=$PATH" ./tools/teardown-libvirt-networks.sh

  package-marmotd-volume:
    runs-on: [ self-hosted, any ]
    needs: 
      - module-tests
    if: always()
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: Test pkg/marmotd ボリューム機能テスト
      run: |
        cd pkg/marmotd
        sudo -E env "PATH=$PATH" make test-volume
        sudo -E env "PATH=$PATH" make test-ceph
        cd ../..

  package-marmotd-server:
    runs-on: [ self-hosted, any ]
    needs: 
      - module-tests
    if: always()
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: 仮想ネットワーク作成
      run: | 
        sudo -E env "PATH=$PATH" ./tools/setup-libvirt-networks.sh
    - name: Test pkg/marmotd サーバー機能テスト
      run: |
        cd pkg/marmotd
        sudo -E env "PATH=$PATH" make test-server
        cd ../..
    - name: 仮想ネットワーク削除
      if: always()
      run: |
        sudo -E env "PATH=$PATH" ./tools/teardown-libvirt-networks.sh

  package-marmotd-etc:
    runs-on: [ self-hosted, any ]
    needs: 
      - module-tests
    if: always()
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: 仮想ネットワーク削除
      if: always()
      run: |
        sudo -E env "PATH=$PATH" ./tools/teardown-libvirt-networks.sh
    - name: Test pkg/marmotd ネットワーク機能テスト
      run: |
        cd pkg/marmotd
        sudo env "PATH=$PATH" make test-vnet
        sudo env "PATH=$PATH" make test-ipnet
        sudo env "PATH=$PATH" make test-cloud-init
        sudo env "PATH=$PATH" make test-timeout
        sudo env "PATH=$PATH" make test-backing-store
        sudo env "PATH=$PATH" make test-config
        sudo env "PATH=$PATH" make test-volume-backing-store 
        cd ../..
    - name: 仮想ネットワーク削除
      if: always()
      run: |
        sudo -E env "PATH=$PATH" ./tools/teardown-libvirt-networks.sh

  package-marmotd-images:
    runs-on: [ self-hosted, any ]
    needs: 
      - module-tests
    if: always()
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: 仮想ネットワーク作成
      run: | 
        sudo -E env "PATH=$PATH" ./tools/setup-libvirt-networks.sh
    - name: Test pkg/marmotd サーバーとイメージ機能テスト
      run: |
        cd pkg/marmotd
        sudo env "PATH=$PATH" make test-server-image
        cd ../..
    - name: 仮想ネットワーク削除
      if: always()
      run: |
        sudo -E env "PATH=$PATH" ./tools/teardown-libvirt-networks.sh
 
  package-marmotd-osimage:
    runs-on: [ self-hosted, any ]
    needs: 
      - module-tests
    if: always()
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: Test pkg/marmotd OSイメージ機能テスト
      run: |
        cd pkg/marmotd
        sudo env "PATH=$PATH" make test-osimage
        cd ../..

  mactl-vm-deploy-basic:
    runs-on: [ self-hosted, any ]
    needs: 
      - system-tests
    if: always()
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: 仮想ネットワーク作成
      run: |
        sudo -E env "PATH=$PATH" ./tools/setup-libvirt-networks.sh
    - name: mactlコマンドのテスト その１
      run: |
        cd cmd/mactl
        make mactl-test
        sudo -E env "PATH=$PATH" make test0
        cd ../..
        sudo -E env "PATH=$PATH" ./tools/cleanup.sh
    - name: 仮想ネットワーク削除
      if: always()
      run: |
        sudo -E env "PATH=$PATH" ./tools/teardown-libvirt-networks.sh

  mactl-vm-deploy-1:
    runs-on: [ self-hosted, any ]
    needs: 
      - system-tests
    if: always()
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: 仮想ネットワーク作成
      run: |
        sudo -E env "PATH=$PATH" ./tools/setup-libvirt-networks.sh
    - name: mactlコマンドのテスト その１
      run: |
        cd cmd/mactl
        make mactl-test
        sudo -E env "PATH=$PATH" make test1
        cd ../..
        sudo -E env "PATH=$PATH" ./tools/cleanup.sh
    - name: 仮想ネットワーク削除
      if: always()
      run: |
        sudo -E env "PATH=$PATH" ./tools/teardown-libvirt-networks.sh

  mactl-vm-deploy-2:
    runs-on: [ self-hosted, any ]
    needs: 
      - system-tests
    if: always()
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: 仮想ネットワーク削除
      if: always()
      run: |
        sudo -E env "PATH=$PATH" ./tools/teardown-libvirt-networks.sh
    - name: mactlコマンドのテスト その２
      run: |
        cd cmd/mactl
        sudo -E env "PATH=$PATH" make mactl-test
        sudo -E env "PATH=$PATH" make test2
        cd ../..
        sudo -E env "PATH=$PATH" ./tools/cleanup.sh
    - name: 仮想ネットワーク削除
      if: always()
      run: |
        sudo -E env "PATH=$PATH" ./tools/teardown-libvirt-networks.sh

  mactl-vm-deploy-3:
    runs-on: [ self-hosted, any ]
    needs: 
      - system-tests
    if: always()
    steps:
    - uses: actions/checkout@v5
    #- uses: actions/setup-go@v6
    #  with:
    #    go-version: '1.26.2'
    - name: 仮想ネットワーク削除
      if: always()
      run: | 
        sudo -E env "PATH=$PATH" ./tools/teardown-libvirt-networks.sh
    - name: mactlコマンドのテスト その３
      run: | 
        cd cmd/mactl
        sudo -E env "PATH=$PATH" make mactl-test
        sudo -E env "PATH=$PATH" make test3
        cd ../..
        sudo -E env "PATH=$PATH" ./tools/cleanup.sh
    - name: 仮想ネットワーク削除
      if: always()
      run: |
        sudo -E env "PATH=$PATH" ./tools/teardown-libvirt-networks.sh


    #- name: Test cmd/maadm
    #  run: | 
    #    cd cmd/maadm
    #    sudo -s mkdir -p bin
    #    sudo -s chown ubuntu:ubuntu bin
    #    sudo -s chmod 755 bin
    #    sudo -E env "PATH=$PATH" make test
    #    sudo rm -fr bin
    #    cd ../..
 
  module-tests-end:
    runs-on: [ self-hosted, any ]
    needs: 
      - package-qcow2-manipulation
      - package-config
      - package-etcd-access
      - package-util
      - package-lvm
      - package-virsh
      - package-ceph
      - package-marmotd-volume
      - package-marmotd-server
      - package-marmotd-etc
      - package-marmotd-images
      - package-marmotd-osimage
      - mactl-command-tests
    steps:
    - uses: actions/checkout@v5

  system-tests-end:
    runs-on: [ self-hosted, any ]
    needs: 
      - mactl-vm-deploy-basic
      - mactl-vm-deploy-1
      - mactl-vm-deploy-2
      - mactl-vm-deploy-3
    steps:
    - uses: actions/checkout@v5

  final-cleanup:
    runs-on: [ self-hosted, any ]
    needs: 
      - module-tests-end
      - system-tests-end
    steps:
    - uses: actions/checkout@v5
    - name: 最終クリーンアップ
      run: |
        sleep 1
